const compressImage = (file) => new Promise((res) => {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

const PAL = ['#d4af37', '#10b981', '#3b82f6', '#ef4444', '#a855f7', '#f97316', '#14b8a6', '#eab308'];
const short = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const SPAL = ['#ef4444', '#3b82f6', '#10b981', '#ffffff', '#d4af37', '#a855f7', '#f97316', '#14b8a6', '#ec4899', '#64748b', '#9ca3af']; // rojo, azul, verde, blanco, dorado... (último = Otros)

const readProductImg = (file) => new Promise((res) => {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 360 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85));
    };
    img.onerror = () => res('');
    img.src = r.result;
  };
  r.readAsDataURL(file);
});
const arcPath = (cx, cy, r0, r1, a0, a1) => {
  const f = Math.min(a1 - a0, Math.PI * 2 - 0.0001), e = a0 + f, L = f > Math.PI ? 1 : 0;
  const pt = (r, a) => (cx + r * Math.cos(a)).toFixed(3) + ' ' + (cy + r * Math.sin(a)).toFixed(3);
  if (r0 <= 0) return `M${cx} ${cy} L${pt(r1, a0)} A${r1} ${r1} 0 ${L} 1 ${pt(r1, e)} Z`;
  return `M${pt(r1, a0)} A${r1} ${r1} 0 ${L} 1 ${pt(r1, e)} L${pt(r0, e)} A${r0} ${r0} 0 ${L} 0 ${pt(r0, a0)} Z`;
};
const Pie = ({ data, fv = fmt }) => {
  const tot = data.reduce((a, d) => a + d.value, 0);
  let acc = -Math.PI / 2;
  return (
    <div className="flex flex-wrap items-center gap-5">
      <svg viewBox="0 0 200 200" className="w-40 h-40 shrink-0">
        <circle cx="100" cy="100" r="98" fill="#e7e5e0" />
        {tot > 0 && data.filter(d => d.value > 0).map((d, i) => { const a1 = acc + d.value / tot * Math.PI * 2; const el = <path key={i} d={arcPath(100, 100, 0, 98, acc, a1)} fill={d.color} stroke="#c9c4b8" strokeWidth="0.8"><title>{d.label}</title></path>; acc = a1; return el; })}
      </svg>
      <div className="space-y-2 text-xs flex-1 min-w-[180px]">
        {data.map(d => (
          <div key={d.label} className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm shrink-0" style={{ background: d.color, border: '1px solid rgba(0,0,0,.2)' }} /><span className="text-neutral-300">{d.label}</span>
            <span className="text-white font-semibold ml-auto pl-3 text-right">{tot ? Math.round(d.value * 100 / tot) : 0}% · {fv(d.value)}</span></div>
        ))}
      </div>
    </div>
  );
};

    <span style={{ position: 'absolute', top: 3, left: 3, width: 24, height: 24, borderRadius: '50%', background: '#fff', boxShadow: '0 2px 6px rgba(0,0,0,.35)', transform: on ? 'translateX(22px)' : 'translateX(0)', transition: 'transform .38s cubic-bezier(.34,1.56,.64,1)' }} />
  </button>
);
const BarsChart = ({ labels, series, fv = fmt }) => {
  const W = 520, H = 200, pl = 40, pb = 24, pt = 10;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const gw = (W - pl) / labels.length, bw = Math.min(26, gw / (series.length + 0.6));
  return (
    <div>
      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full">
        {[0, 0.5, 1].map(t => { const y = pt + (H - pb - pt) * (1 - t); return <g key={t}><line x1={pl} x2={W} y1={y} y2={y} stroke="#d6d3d1" strokeDasharray="3 3" /><text x={pl - 5} y={y + 3} textAnchor="end" fontSize="9" fill="#78716c">{short(max * t)}</text></g>; })}
        {labels.map((l, i) => (
          <g key={l + i}>
            {series.map((sr, j) => { const bh = (H - pb - pt) * Math.max(0, sr.values[i]) / max; return <rect key={j} x={pl + gw * i + (gw - bw * series.length) / 2 + bw * j} y={H - pb - bh} width={bw - 2} height={bh} rx="3" fill={sr.color}><title>{sr.name}: {fv(sr.values[i])}</title></rect>; })}
            <text x={pl + gw * i + gw / 2} y={H - 8} textAnchor="middle" fontSize="10" fill="#78716c">{l}</text>
          </g>
        ))}
      </svg>
      <div className="flex flex-wrap gap-4 mt-2 text-xs">{series.map(sr => <span key={sr.name} className="flex items-center gap-1.5 text-neutral-400"><span className="w-3 h-3 rounded-sm" style={{ background: sr.color }} />{sr.name}</span>)}</div>
    </div>
  );
};
const HBars = ({ rows }) => {
  const max = Math.max(1, ...rows.map(r => r.value));
  return (
    <div className="space-y-3">
      {rows.map((r, i) => (
        <div key={r.label}>
          <div className="flex justify-between gap-3 text-xs mb-1"><span className="text-neutral-300 truncate">{r.label}</span><span className="text-white font-semibold shrink-0">{r.text}</span></div>
          <div className="h-2.5 rounded-full bg-black/10 overflow-hidden"><div className="h-full rounded-full transition-all duration-700" style={{ width: Math.max(2, r.value * 100 / max) + '%', background: PAL[i % PAL.length] }} /></div>
        </div>
      ))}
      {rows.length === 0 && <p className="text-xs text-neutral-500 text-center py-4">Sin datos en este período.</p>}
    </div>
  );
};

function App() {
  // Auth State
  const [isAuthed, setIsAuthed] = useState(false);
  const [loginUser, setLoginUser] = useState('');
  const [loginPass, setLoginPass] = useState('');
  const [loginError, setLoginError] = useState(false);
  const [showPass, setShowPass] = useState(false);
  const [role, setRole] = useState('barbero');
  const [users, setUsers] = usePersist('bm_users', INITIAL_USERS);
  const [currentUserId, setCurrentUserId] = useState(null);
  const [schedule, setSchedule] = usePersist('bm_schedule', DEFAULT_SCHEDULE);
  const [slotStep, setSlotStep] = usePersist('bm_slot_v2', 30);
  const [products, setProducts] = usePersist('bm_products', INITIAL_PRODUCTS);
  const [sales, setSales] = usePersist('bm_sales', []);
  const [shake, setShake] = useState(0);

  const handleLogin = (e) => {
    e.preventDefault();
    const u = users.find(x => x.username.toLowerCase() === loginUser.trim().toLowerCase() && x.password === loginPass && !x.suspended);
    if (u) {
      setRole(u.role);
      setCurrentUserId(u.id);
      setActiveTab((PERMS[u.role] || ['historial'])[0]);
      setIsAuthed(true);
      setLoginError(false);
    } else {
      setLoginError(true);
      setShake(s => s + 1);
    }
    setLoginPass('');
  };

  // Navigation State
  const [activeTab, setActiveTab] = useState('historial');
  const [bookingModalOpen, setBookingModalOpen] = useState(false);
  const [bdayOpen, setBdayOpen] = useState(false);
  const [goals, setGoals] = usePersist('bm_goals', {});
  const [cash, setCash] = usePersist('bm_cash', {});
  const [cajaDay, setCajaDay] = useState(TODAY_STR);
  const [repTab, setRepTab] = useState('resumen');
  const [prodFormOpen, setProdFormOpen] = useState(false);
  const [prodForm, setProdForm] = useState({ name: '', category: 'Bebidas', price: '', stock: '', min: '', img: '' });
  const [openBarber, setOpenBarber] = useState('');
  const [svcQuery, setSvcQuery] = useState('');
  
  // App Main States
  const [barbers, setBarbers] = usePersist('bm_barbers', INITIAL_BARBERS);
  const [services, setServices] = usePersist('bm_services_v3', INITIAL_SERVICES);
  const [clients, setClients] = usePersist('bm_clients', INITIAL_CLIENTS);
  const [bookings, setBookings] = usePersist('bm_bookings', INITIAL_BOOKINGS);

  // Filter States for Statistics & History
  const [statsPeriod, setStatsPeriod] = useState('mes'); // 'hoy', 'semana', 'quincena', 'mes', 'ano'
  const [bookingFilterStatus, setBookingFilterStatus] = useState('todos');

  // WhatsApp Modal State
  const [waModalOpen, setWaModalOpen] = useState(false);
  const [waData, setWaData] = useState({ phone: '', message: '', clientName: '' });
  const [copiedMessage, setCopiedMessage] = useState(false);

  // Client Modal State (Details / New)
  const [selectedClient, setSelectedClient] = useState(null);
  const [isEditingClient, setIsEditingClient] = useState(false);
  const [clientFormModalOpen, setClientFormModalOpen] = useState(false);

  // --- FORM STATE FOR NEW RESERVA ---
  const [clientSearchQuery, setClientSearchQuery] = useState('');
  const [selectedClientId, setSelectedClientId] = useState('');
  const [isNewClientForm, setIsNewClientForm] = useState(false);

  // New Client Fields
  const [newClientData, setNewClientData] = useState({
    name: '',
    lastname: '',
    phone: '',
    birthdate: '',
    preferredBarberId: 'b1',
    preferences: '',
    observations: ''
  });

  // Booking fields
  const [selectedServiceIds, setSelectedServiceIds] = useState(['s1']);
  const [selectedBarberId, setSelectedBarberId] = useState('b1');
  const [bookingDate, setBookingDate] = useState(TODAY_STR);
  const [bookingTime, setBookingTime] = useState('16:00');
  const [availabilityWarning, setAvailabilityWarning] = useState(null);

  // Calculate totals for selected services
  const computedTotals = useMemo(() => {
    let price = 0;
    let duration = 0;
    const names = [];

    selectedServiceIds.forEach(id => {
      const s = services.find(item => item.id === id);
      if (s) {
        price += s.price;
        duration += s.duration;
        names.push(s.name);
      }
    });

    // Compute end time
    let endTimeStr = '--:--';
    if (bookingTime) {
      const [h, m] = bookingTime.split(':').map(Number);
      if (!isNaN(h) && !isNaN(m)) {
        const totalMin = h * 60 + m + duration;
        const endH = Math.floor(totalMin / 60) % 24;
        const endM = totalMin % 60;
        endTimeStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      }
    }

    return {
      price,
      duration,
      serviceNames: names.join(', '),
      endTimeStr
    };
  }, [selectedServiceIds, services, bookingTime]);

  // Check collision / availability in real-time
  useEffect(() => {
    if (!bookingDate || !bookingTime || !selectedBarberId) return;

    // Check overlaps for the selected barber
    const [startH, startM] = bookingTime.split(':').map(Number);
    const startTotal = startH * 60 + startM;
    const endTotal = startTotal + computedTotals.duration;

    const barberBookings = bookings.filter(
      b => b.barberId === selectedBarberId && b.date === bookingDate && b.status !== 'Cancelado'
    );

    let conflict = false;
    let conflictingBooking = null;

    for (const b of barberBookings) {
      const [bStartH, bStartM] = b.time.split(':').map(Number);
      const bStartTotal = bStartH * 60 + bStartM;
      const bEndTotal = bStartTotal + b.duration;

      // Overlap logic: (StartA < EndB) and (EndA > StartB)
      if (startTotal < bEndTotal && endTotal > bStartTotal) {
        conflict = true;
        conflictingBooking = b;
        break;
      }
    }

    if (conflict) {
      // Find suggested barbers
      const alternativeBarbers = barbers.filter(b => {
        if (b.id === selectedBarberId) return false;
        const altBookings = bookings.filter(
          bk => bk.barberId === b.id && bk.date === bookingDate && bk.status !== 'Cancelado'
        );
        let hasConflict = false;
        for (const bk of altBookings) {
          const [bkStartH, bkStartM] = bk.time.split(':').map(Number);
          const bkStartTotal = bkStartH * 60 + bkStartM;
          const bkEndTotal = bkStartTotal + bk.duration;
          if (startTotal < bkEndTotal && endTotal > bkStartTotal) {
            hasConflict = true;
            break;
          }
        }
        return !hasConflict;
      });

      setAvailabilityWarning({
        message: `Sin turno disponible: el barbero ya tiene un turno de ${conflictingBooking.time} a ${conflictingBooking.endTime}.`,
        alternatives: alternativeBarbers
      });
    } else {
      setAvailabilityWarning(null);
    }
  }, [bookingDate, bookingTime, selectedBarberId, computedTotals.duration, bookings, barbers]);

  // Handle Select Client from Search
  const handleSelectClient = (client) => {
    setSelectedClientId(client.id);
    setClientSearchQuery(`${client.name} ${client.lastname} (${client.phone})`);
    setIsNewClientForm(false);
    if (client.preferredBarberId) {
      setSelectedBarberId(client.preferredBarberId);
    }
  };

  // Toggle Service Selection
  const toggleService = (id) => {
    if (selectedServiceIds.includes(id)) {
      if (selectedServiceIds.length > 1) {
        setSelectedServiceIds(selectedServiceIds.filter(sId => sId !== id));
      }
    } else {
      setSelectedServiceIds([...selectedServiceIds, id]);
    }
  };

  // Create Booking Action
  const handleSaveBooking = (e) => {
    e.preventDefault();
    if (slotIssue || availabilityWarning) { alert('Sin turno disponible a esa hora para este servicio. Elegí otra hora u otro barbero.'); return; }

    let clientToUseId = selectedClientId;
    let clientNameStr = '';
    let clientPhoneStr = '';

    // If new client form filled
    if (isNewClientForm || !selectedClientId) {
      if (!newClientData.name || !newClientData.phone) {
        alert('Por favor ingrese al menos Nombre y Teléfono del cliente.');
        return;
      }

      // Check duplicate phone
      const existing = clients.find(c => c.phone.trim() === newClientData.phone.trim());
      if (existing) {
        clientToUseId = existing.id;
        clientNameStr = `${existing.name} ${existing.lastname}`;
        clientPhoneStr = existing.phone;
      } else {
        const newC = {
          id: `c-${Date.now()}`,
          name: newClientData.name,
          lastname: newClientData.lastname,
          phone: newClientData.phone,
          birthdate: newClientData.birthdate,
          registrationDate: TODAY_STR,
          preferredBarberId: selectedBarberId,
          preferences: newClientData.preferences,
          observations: newClientData.observations,
          visitsCount: 0,
          totalSpent: 0
        };
        setClients([newC, ...clients]);
        clientToUseId = newC.id;
        clientNameStr = `${newC.name} ${newC.lastname}`;
        clientPhoneStr = newC.phone;
      }
    } else {
      const existing = clients.find(c => c.id === selectedClientId);
      clientNameStr = `${existing.name} ${existing.lastname}`;
      clientPhoneStr = existing.phone;
    }

    const targetBarber = barbers.find(b => b.id === selectedBarberId);

    const newBooking = {
      id: `bk-${Date.now()}`,
      clientId: clientToUseId,
      clientName: clientNameStr,
      clientPhone: clientPhoneStr,
      barberId: selectedBarberId,
      barberName: targetBarber ? targetBarber.name : 'Barbero Blackmen',
      serviceIds: [...selectedServiceIds],
      serviceNames: computedTotals.serviceNames,
      date: bookingDate,
      time: bookingTime,
      duration: computedTotals.duration,
      endTime: computedTotals.endTimeStr,
      totalPrice: computedTotals.price,
      status: 'Pendiente',
      createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
    };

    setBookings([newBooking, ...bookings]);

    // Format WhatsApp message
    const formattedDate = new Date(bookingDate + 'T00:00:00').toLocaleDateString('es-ES', {
      weekday: 'long',
      day: 'numeric',
      month: 'long'
    });

    const msg = `Hola, ${clientNameStr}. Gracias por comunicarte con *Blackmen Barbería*.\n\nTu reserva quedó registrada con éxito:\n\n*Fecha:* ${formattedDate}\n*Horario:* ${bookingTime} hs\n*Barbero:* ${targetBarber?.name || 'Asignado'}\n*Servicio(s):* ${computedTotals.serviceNames}\n*Duración estimada:* ${computedTotals.duration} min\n*Total:* ${computedTotals.price.toLocaleString('es-PY')} Gs.\n\nTe esperamos en Blackmen Barbería.`;

    setWaData({
      phone: clientPhoneStr,
      message: msg,
      clientName: clientNameStr
    });
    setWaModalOpen(true);
    setBookingModalOpen(false);

    // Reset Form
    setSelectedClientId('');
    setClientSearchQuery('');
    setIsNewClientForm(false);
    setNewClientData({ name: '', lastname: '', phone: '', birthdate: '', preferredBarberId: 'b1', preferences: '', observations: '' });
  };

  // Open Direct WhatsApp Confirmation Generator
  const openWhatsAppModalForBooking = (bk) => {
    const formattedDate = new Date(bk.date + 'T00:00:00').toLocaleDateString('es-ES', {
      weekday: 'long',
      day: 'numeric',
      month: 'long'
    });

    const msg = `Hola, ${bk.clientName}. Recordatorio de *Blackmen Barbería*:\n\nTu reserva:\n*Fecha:* ${formattedDate}\n*Horario:* ${bk.time} hs\n*Barbero:* ${bk.barberName}\n*Servicio:* ${bk.serviceNames}\n*Total:* ${bk.totalPrice.toLocaleString('es-PY')} Gs.\n\nTe esperamos.`;

    setWaData({
      phone: bk.clientPhone,
      message: msg,
      clientName: bk.clientName
    });
    setWaModalOpen(true);
  };

  // Open WhatsApp Birthday Greeting Generator
  const openBirthdayWaModal = (client) => {
    const msg = `Hola ${client.name}. Todo el equipo de *Blackmen Barbería* te desea un muy feliz cumpleaños.\n\nQueremos regalarte un *20% OFF en tu próximo combo* durante todo este mes. Vení a brindar con nosotros y lucir impecable en tu día.\n\nReservá respondiendo a este mensaje.`;
    setWaData({
      phone: client.phone,
      message: msg,
      clientName: `${client.name} ${client.lastname}`
    });
    setWaModalOpen(true);
  };

  // Copy Message to Clipboard
  const handleCopyMessage = () => {
    navigator.clipboard.writeText(waData.message);
    setCopiedMessage(true);
    setTimeout(() => setCopiedMessage(false), 2500);
  };

  // Launch WhatsApp Web/App
  const handleOpenWhatsAppLink = () => {

                />
              </div>

              <button
                onClick={() => {
                  setSelectedClient({
                    id: `c-${Date.now()}`,
                    name: '',
                    lastname: '',
                    phone: '+595',
                    birthdate: '',
                    registrationDate: TODAY_STR,
                    preferredBarberId: 'b1',
                    preferences: '',
                    observations: '',
                    visitsCount: 0,
                    totalSpent: 0
                  });
                  setIsEditingClient(false);
                  setClientFormModalOpen(true);
                }}
                className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-[#d4af37] hover:bg-[#e3c25b] text-black font-bold text-sm transition-all flex items-center justify-center space-x-2 "
              >
                <UserPlus className="w-4 h-4" />
                <span>+ Nuevo Cliente</span>

            {/* CLIENTS GRID CARDS */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                  const preferredBarber = barbers.find(b => b.id === client.preferredBarberId);
                  return (
                    <div
                      key={client.id}
                      className="bg-[#141414] border border-[#2b2822] rounded-xl p-5 hover:border-neutral-700 transition-all flex flex-col justify-between space-y-4 group"
                    >
                      <div className="space-y-3">
                        <div className="flex items-start justify-between">
                          <div className="flex items-center space-x-3">
                            <div className="w-12 h-12 rounded-xl bg-[#141414] border border-neutral-700 flex items-center justify-center text-white font-bold text-lg group-hover:border-white/30 transition-all">
                              {client.name.charAt(0)}{client.lastname ? client.lastname.charAt(0) : ''}
                            </div>
                            <div>
                              <h3 className="text-base font-bold text-white group-hover:text-white transition-all">
                                {client.name} {client.lastname}
                              </h3>
                              <p className="text-xs text-neutral-400 flex items-center gap-1 mt-0.5">
                                <Phone className="w-3 h-3 text-white" /> {client.phone}
                              </p>
                            </div>
                          </div>
                        </div>

                        {/* PREFERENCES & STATS */}
                        <div className="grid grid-cols-2 gap-2 bg-black p-3 rounded-xl border border-neutral-800/80 text-xs">
                          <div>
                            <span className="text-neutral-500 block">Visitas Realizadas</span>
                            <span className="font-bold text-neutral-200">{client.visitsCount} visitas</span>
                          </div>
                          <div>
                            <span className="text-neutral-500 block">Gasto Acumulado</span>
                            <span className="font-bold text-neutral-200">{(client.totalSpent || 0).toLocaleString('es-PY')} Gs</span>
                          </div>
                          <div className="col-span-2">
                            <span className="text-neutral-500 block">Última visita</span>
                            <span className="font-bold text-neutral-200">{(() => {
                              const d = bookings.filter(b => b.clientId === client.id && b.status === 'Completado').map(b => b.date).sort().pop();
                              if (!d) return 'Sin visitas';
                              const [y, mo, da] = d.split('-'); return da + '/' + mo + '/' + y;

                        {client.preferences && (
                          <div className="text-xs text-neutral-400 bg-black/50 p-2.5 rounded-lg border border-neutral-800/40">
                            <span className="text-white/90 font-medium">Preferencias:</span> {client.preferences}
                          </div>
                        )}
                      {(() => {
                          const ups = bookings.filter(b => b.clientId === client.id && b.status === 'Pendiente' && b.date >= TODAY_STR).sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time)).slice(0, 2);
                          return ups.length ? (
                            <div className="text-xs bg-[#d4af37]/10 border border-[#d4af37]/30 rounded-lg p-2.5 text-neutral-300">

                            onClick={() => {

        {/* ========================================================

           ======================================================== */}
        {activeTab === 'historial' && (() => {
          const sc = schedule[new Date(agendaDate + 'T12:00:00').getDay()];
          const slots = [];
          if (sc && sc.on) for (let m = toMin(sc.open); m < toMin(sc.close); m += Number(slotStep)) slots.push(toHHMM(m));
          const vb = role === 'barbero' ? barbers.filter(x => x.id === myBarberId) : agendaBarber === 'todos' ? barbers : barbers.filter(x => x.id === agendaBarber);
          const minDur = Math.max(5, Math.min(...services.map(x => x.duration || 30)));
          const dayB = bookings.filter(x => x.date === agendaDate && x.status !== 'Cancelado' && vb.some(v => v.id === x.barberId));
          const sum = (arr) => arr.reduce((acc, x) => acc + x.totalPrice, 0);
          const paidD = dayB.filter(x => x.status === 'Completado');
          const dueD = dayB.filter(x => x.status === 'Pendiente');
          const days = Array.from({ length: 21 }, (_, i) => addDays(TODAY_STR, i - 3));
          const endM = (x) => toMin(x.time) + (Number(x.duration) || 0);
          const cellFor = (barberId, time) => {
            const s0 = toMin(time), s1 = s0 + Number(slotStep), closeM = toMin(sc.close);
            const mine = dayB.filter(x => x.barberId === barberId);
            const inSlot = mine.filter(x => toMin(x.time) < s1 && Math.max(endM(x), toMin(x.time) + 1) > s0);
            if (!inSlot.length) {
              const nexts = mine.map(x => toMin(x.time)).filter(m => m >= s0);
              return { type: 'free', gap: Math.min(closeM, ...nexts) - s0 };
            }
            const starts = inSlot.filter(x => toMin(x.time) >= s0);
            const lastEnd = Math.max(s0, ...inSlot.map(endM));
            const nexts = mine.map(x => toMin(x.time)).filter(m => m >= lastEnd);
            const gap = Math.min(closeM, ...nexts) - lastEnd;
            return { type: starts.length ? 'start' : 'busy', list: starts, freeFrom: (lastEnd < s1 && gap >= minDur) ? toHHMM(lastEnd) : null };
          };
          const moreBtn = (c, br) => c.freeFrom ? (
            <button type="button" onClick={() => openBooking(agendaDate, c.freeFrom, br.id)} className="w-full py-1.5 rounded-lg border border-dashed border-neutral-800 hover:border-white text-[11px] text-neutral-500 hover:text-white">+ Libre desde {c.freeFrom}</button>
          ) : null;
          const card = (b) => {
            const paid = b.status === 'Completado';
            const due = b.status === 'Pendiente';
            const tone = paid ? 'border-l-emerald-500 bg-emerald-500/5' : due ? 'border-l-red-500 bg-red-500/5' : 'border-l-neutral-700 bg-[#141414]';
            const pill = paid ? ['Cobrado', 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'] : due ? ['Por cobrar', 'bg-red-500/15 text-red-400 border-red-500/30'] : [b.status, 'bg-neutral-800 text-neutral-400 border-neutral-700'];
            return (
              <div key={b.id} className={`rounded-xl border border-[#2b2822] border-l-4 p-2.5 ${tone}`}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p className="text-sm font-semibold text-white truncate">{b.time}{b.endTime ? '–' + b.endTime : ''} · {b.clientName}</p>
                    <p className="text-[11px] text-neutral-400 truncate">{b.serviceNames}</p>
                  </div>
                  <span className={`shrink-0 px-2 py-0.5 rounded-full text-[10px] font-semibold border ${pill[1]}`}>{pill[0]}</span>
                </div>
                <div className="flex items-center justify-between mt-2 gap-2">
                  <span className="text-xs font-bold text-white">{fmt(b.totalPrice)}</span>
                  <div className="flex items-center gap-1">
                    <button onClick={() => openWhatsAppModalForBooking(b)} title="WhatsApp" className="p-1.5 rounded-lg bg-neutral-900 border border-[#2b2822] text-neutral-300 hover:text-white"><MessageSquare className="w-3.5 h-3.5" /></button>
                    {due && canPay && <button onClick={() => { pickBooking(b.id); setActiveTab('pagos'); }} className="px-2.5 py-1.5 rounded-lg bg-[#d4af37] text-black text-[11px] font-semibold">Cobrar</button>}
                    {due && <button onClick={() => handleUpdateBookingStatus(b.id, 'Cancelado')} className="px-2 py-1.5 rounded-lg border border-[#2b2822] text-[11px] text-neutral-400 hover:text-red-400">Cancelar</button>}
                  </div>
                </div>
              </div>
            );
          };
          return (
            <div className="space-y-5">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <h2 className="text-white">Agenda y turnos</h2>
                  <p className="text-xs text-neutral-500 mt-0.5">Tocá una hora libre para agendar, o usá Nuevo turno para elegir la hora a mano. Verde: cobrado. Rojo: pendiente de cobro.</p>
                </div>
                <button type="button" onClick={() => openBooking(agendaDate, slots[0] || '09:00', role === 'barbero' ? myBarberId : (agendaBarber !== 'todos' ? agendaBarber : (barbers[0] && barbers[0].id)))} className="shrink-0 px-4 py-2 rounded-xl bg-[#d4af37] hover:bg-[#e3c25b] text-black text-xs font-semibold">+ Nuevo turno</button>
              </div>

              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                {days.map(d => {
                  const dt = new Date(d + 'T12:00:00');
                  const open = schedule[dt.getDay()] && schedule[dt.getDay()].on;
                  const on = d === agendaDate;
                  return (
                    <button key={d} onClick={() => setAgendaDate(d)}
                      className={`shrink-0 w-14 py-2 rounded-xl border text-center ${on ? 'bg-[#d4af37] text-black border-[#d4af37]' : open ? 'border-[#2b2822] text-neutral-300 hover:border-neutral-600' : 'border-neutral-900 text-neutral-700'}`}>
                      <p className="text-[10px] uppercase">{dt.toLocaleDateString('es-PY', { weekday: 'short' }).replace('.', '')}</p>
                      <p className="text-base font-bold leading-tight">{dt.getDate()}</p>
                      {d === TODAY_STR && <p className="text-[9px] leading-none">hoy</p>}
                    </button>
                  );
                })}
              </div>

              {role !== 'barbero' && (
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                  {[['todos', 'Todos'], ...barbers.map(x => [x.id, x.name])].map(([k, l]) => (
                    <button key={k} onClick={() => setAgendaBarber(k)} className={`px-3 py-1.5 rounded-lg text-xs whitespace-nowrap border ${agendaBarber === k ? 'bg-[#d4af37] text-black border-[#d4af37]' : 'border-[#2b2822] text-neutral-400 hover:text-white'}`}>{l}</button>
                  ))}
                </div>
              )}

              <div className="grid grid-cols-3 gap-3">
                <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-3.5">
                  <p className="text-[11px] text-neutral-500">Turnos del día</p>
                  <p className="text-base sm:text-xl font-bold text-white mt-1">{dayB.length}</p>
                </div>
                <div className="bg-emerald-500/5 border border-emerald-500/30 rounded-xl p-3.5">
                  <p className="text-[11px] text-emerald-400">Cobrado</p>
                  <p className="text-base sm:text-xl font-bold text-white mt-1 break-words">{fmt(sum(paidD))}</p>
                </div>
                <div className="bg-red-500/5 border border-red-500/30 rounded-xl p-3.5">
                  <p className="text-[11px] text-red-400">Por cobrar</p>
                  <p className="text-base sm:text-xl font-bold text-white mt-1 break-words">{fmt(sum(dueD))}</p>
                </div>
              </div>

              {slots.length === 0 ? (
                <div className={CARD + ' text-center text-sm text-neutral-500'}>La barbería no atiende este día.</div>
              ) : (
                <div className="space-y-2">
                  <div className="slot-head pl-[68px]" style={{ '--cols': vb.length }}>
                    {vb.map(br => <p key={br.id} className="text-xs font-semibold text-neutral-400 px-1 truncate">{br.name}</p>)}
                  </div>
                  {slots.map(time => (
                    <div key={time} className="flex gap-3 items-stretch">
                      <div className="w-14 shrink-0 pt-3 text-sm font-semibold text-neutral-300">{time}</div>
                      <div className="slot-cells flex-1 min-w-0" style={{ '--cols': vb.length }}>
                        {vb.map(br => {
                          const c = cellFor(br.id, time);
                          if (c.type === 'start') return <div key={br.id} className="space-y-2">{c.list.map(card)}{moreBtn(c, br)}</div>;
                          if (c.type === 'busy') return <div key={br.id} className="space-y-2"><div className="min-h-[56px] rounded-xl bg-neutral-900/50 border border-neutral-900 flex items-center justify-center text-[11px] text-neutral-600">Ocupado · {br.name}</div>{moreBtn(c, br)}</div>;
                          if (c.gap < minDur) return <div key={br.id} className="min-h-[56px] rounded-xl border border-neutral-900 flex items-center justify-center text-[11px] text-neutral-600">Sin turno disponible</div>;
                          return (
                            <button key={br.id} onClick={() => openBooking(agendaDate, time, br.id)}
                              className="w-full min-h-[56px] rounded-xl border border-dashed border-[#2b2822] hover:border-white hover:bg-white/5 text-neutral-500 hover:text-white text-xs flex items-center justify-center gap-1.5">
                              <PlusCircle className="w-3.5 h-3.5" /> Libre <span className="md:hidden text-neutral-600">· {br.name}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })()}

        {/* ========================================================
            TAB 5: ESTADÍSTICAS & INTEGRACIÓN CON FINANZAS / CAJA
           ======================================================== */}
        {activeTab === 'estadisticas' && (
          <div className="space-y-6">
            
            {/* PERIOD FILTER */}
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div>
                <h2 className="text-white">Reportes</h2>
                <p className="text-xs text-neutral-500 mt-0.5">Rendimiento general del negocio</p>
              </div>
              <div className="inline-flex max-w-full overflow-x-auto no-scrollbar self-start sm:self-auto p-0.5 rounded-lg bg-[#141414] border border-[#2b2822]">
                {[['hoy', 'Hoy'], ['semana', 'Semana'], ['quincena', 'Quincena'], ['mes', 'Mes'], ['ano', 'Año']].map(([p, l]) => (
                  <button key={p} onClick={() => setStatsPeriod(p)}
                    className={`px-2.5 py-1 rounded-md text-[11px] font-medium whitespace-nowrap ${statsPeriod === p ? 'bg-[#d4af37] text-black' : 'text-neutral-400 hover:text-white'}`}>
                    {l}
                  </button>
                ))}
              </div>
            </div>
            {renderReportes()}
            {repTab === 'reservas' && (<>

            {/* KEY METRICS */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-3.5 sm:p-4">
                <p className="text-[11px] text-neutral-500">Ingresos cobrados</p>
                <p className="text-base sm:text-xl break-words font-bold text-white mt-1 leading-tight">{fmt(statsMetrics.totalIncome)}</p>
                <p className="text-[10px] text-neutral-600 mt-1">Sin cancelados ni ausentes</p>
              </div>
              <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-3.5 sm:p-4">
                <p className="text-[11px] text-neutral-500">Servicios completados</p>
                <p className="text-base sm:text-xl break-words font-bold text-white mt-1 leading-tight">{statsMetrics.completedCount}</p>
                <p className="text-[10px] text-neutral-600 mt-1">De {statsMetrics.totalBookings} agendados</p>
              </div>
              <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-3.5 sm:p-4">
                <p className="text-[11px] text-neutral-500">Ticket promedio</p>
                <p className="text-base sm:text-xl break-words font-bold text-white mt-1 leading-tight">{fmt(statsMetrics.avgTicket)}</p>
                <p className="text-[10px] text-neutral-600 mt-1">Por cliente atendido</p>
              </div>
              <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-3.5 sm:p-4">
                <p className="text-[11px] text-neutral-500">Cancelaciones y ausencias</p>
                <p className="text-base sm:text-xl break-words font-bold text-red-500 mt-1 leading-tight">{statsMetrics.canceledCount + statsMetrics.noShowCount}</p>
                <p className="text-[10px] text-neutral-600 mt-1">{statsMetrics.canceledCount} cancelados · {statsMetrics.noShowCount} ausentes</p>
              </div>
            </div>

            {/* SERVICES POPULARITY BREAKDOWN */}
            <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-4 sm:p-6 space-y-4">
              <h3 className="text-sm font-bold text-white uppercase tracking-wider">Demanda de servicios</h3>

              <div className="space-y-3">
                {services.filter(x => !x.suspended).map(s => {
                  const count = statsMetrics.serviceCounts[s.id] || 0;
                  const percent = statsMetrics.totalBookings > 0 ? Math.round((count / statsMetrics.totalBookings) * 100) : 0;
                  return (
                    <div key={s.id} className="space-y-1">
                      <div className="flex justify-between items-center gap-3 text-xs font-semibold">

        {/* ===== REGISTRO DE PAGOS ===== */}

                      <div className={'flex-1 min-w-0 transition-opacity ' + (sv.suspended ? 'opacity-50' : '')}>

                      </div>
                      <span className={'hidden sm:flex w-20 justify-center ' + (sv.suspended ? 'opacity-50' : '')}><span className="px-2 py-0.5 rounded-md bg-white/5 border border-[#2b2822] text-[11px] text-neutral-300">{sv.duration ? sv.duration + ' min' : '—'}</span></span>
                      <span className={'hidden sm:block w-32 text-right text-sm font-semibold text-white ' + (sv.suspended ? 'opacity-50' : '')}>{fmt(sv.price)}</span>

        {/* ===== GASTOS Y PAGOS ===== */}
        {(activeTab === 'finanzas' || activeTab === 'gastos') && (() => {
          const isG = activeTab === 'gastos';
          const inFin = (d) => finDay ? d === finDay : inRange(d, finPeriod);
          const pays = payments.filter(x => !x.voided && inFin(x.date));
          const sls = sales.filter(x => inFin(x.date));
          const exps = expenses.filter(x => inFin(x.date));
          const inServ = pays.reduce((a, x) => a + x.amount, 0);
          const inMerc = sls.reduce((a, x) => a + x.total, 0);
          const income = inServ + inMerc;
          const spent = exps.reduce((a, x) => a + x.amount, 0);
          const net = income - spent;
          const byCat = EXPENSE_CATS.map(c => [c, exps.filter(x => x.category === c).reduce((a, x) => a + x.amount, 0)]).filter(x => x[1] > 0);
          const bName = (id) => (barbers.find(x => x.id === id) || {}).name || '';
          const moves = [
            ...pays.map(x => ({ id: x.id, date: x.date, type: 'in', tag: 'Servicio', title: x.clientName, sub: `${x.concept || 'Pago'} · ${x.method}`, amount: x.amount })),
            ...sls.map(x => ({ id: x.id, date: x.date, type: 'in', tag: x.type === 'consumo' ? 'Consumo' : 'Venta', title: `${x.qty} × ${x.name}`, sub: x.type === 'consumo' ? `Consumo de ${bName(x.barberId)}` : 'Venta a cliente', amount: x.total, sale: true })),
            ...exps.map(x => ({ id: x.id, date: x.date, type: 'out', tag: 'Gasto', title: x.concept, sub: x.category, amount: x.amount, exp: true })),
          ].filter(m => isG ? m.type === 'out' : (finType === 'todos' || (finType === 'ingresos' ? m.type === 'in' : m.type === 'out'))).sort((a, b) => b.date.localeCompare(a.date));
          const groups = [];
          moves.forEach(m => { const g = groups.find(q => q.date === m.date); if (g) g.items.push(m); else groups.push({ date: m.date, items: [m] }); });
          const dayLabel = (d) => d === TODAY_STR ? 'Hoy' : new Date(d + 'T12:00:00').toLocaleDateString('es-PY', { weekday: 'long', day: 'numeric', month: 'long' });
          const periods = [['hoy', 'Hoy'], ['semana', 'Semana'], ['quincena', 'Quincena'], ['mes', 'Mes'], ['ano', 'Año']];
          return (
            <div className="space-y-5">
              <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 no-print">
                <div>
                  <h2 className="text-white">{isG ? 'Gastos' : 'Finanzas'}</h2>
                  <p className="text-xs text-neutral-500 mt-0.5">{isG ? 'Registro y control de los gastos de la barbería' : 'Ingresos (servicios y mercadería), gastos y resultado'}</p>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <div className={`inline-flex max-w-full overflow-x-auto no-scrollbar p-0.5 rounded-lg bg-[#141414] border border-[#2b2822] ${finDay ? 'opacity-40' : ''}`}>
                    {periods.map(([k, l]) => (
                      <button key={k} onClick={() => { setFinPeriod(k); setFinDay(''); }} className={`px-2.5 py-1 rounded-md text-[11px] font-medium whitespace-nowrap ${!finDay && finPeriod === k ? 'bg-[#d4af37] text-black' : 'text-neutral-400 hover:text-white'}`}>{l}</button>

                  <button onClick={() => window.print()} className="px-3 py-1.5 rounded-lg border border-[#2b2822] text-[11px] text-neutral-300 hover:text-white">Imprimir reporte</button>
                </div>
              </div>

              {isG && (
                <div className="bg-[#141414] border border-[#2b2822] rounded-xl p-4 sm:p-5 no-print">
                  <h3 className="text-white mb-3">Total de gastos</h3>
                  <div className="grid grid-cols-3 gap-3">
                    {[['semana', 'Semana', 'últimos 7 días'], ['mes', 'Mes', 'últimos 30 días'], ['ano', 'Año', 'últimos 12 meses']].map(([k, l, sub], i) => (

                        <p className="text-base sm:text-xl font-bold text-white mt-1 break-words">{fmt(expenses.filter(x => inRange(x.date, k)).reduce((a, x) => a + x.amount, 0))}</p>

                {isG && (() => {

                  const cats = [...new Set([...EXPENSE_CATS, ...expenses.map(x => x.category)])];

                  const varPct = (a, b) => b === 0 ? (a === 0 ? '—' : 'nuevo') : ((a - b) / b * 100 >= 0 ? '+' : '') + Math.round((a - b) / b * 100) + '%';

                            meses
                          </label>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div className="rounded-xl p-3 border border-[#2b2822] bg-black"><p className="text-[11px] text-neutral-500">Total del período</p><p className="text-base font-bold text-white mt-1 break-words">{fmt(grand)}</p></div>
                        <div className="rounded-xl p-3 border border-[#2b2822] bg-black"><p className="text-[11px] text-neutral-500">Promedio mensual</p><p className="text-base font-bold text-white mt-1 break-words">{fmt(avgM)}</p></div>
                        <div className="rounded-xl p-3 border border-red-500/30 bg-red-500/5"><p className="text-[11px] text-red-400">Mes con más gasto</p><p className="text-base font-bold text-white mt-1">{mLabel(ms[hi])}</p><p className="text-[10px] text-neutral-500 break-words">{fmt(totals[hi])}</p></div>
                        <div className="rounded-xl p-3 border border-emerald-500/30 bg-emerald-500/5"><p className="text-[11px] text-emerald-400">Mes con menos gasto</p><p className="text-base font-bold text-white mt-1">{mLabel(ms[lo])}</p><p className="text-[10px] text-neutral-500 break-words">{fmt(totals[lo])}</p></div>
                      </div>
                      <BarsChart labels={ms.map(mLabel)} series={[{ name: 'Gastos', color: PAL[3], values: totals }]} />
                      <div className="overflow-x-auto">
                        <table className="w-full text-xs min-w-max">
                          <thead><tr className="text-left text-neutral-500"><th className="py-2 pr-4 font-medium sticky left-0 bg-[#141414]">Categoría</th>{ms.map(m => <th key={m} className="py-2 px-2 font-medium text-right whitespace-nowrap">{mLabel(m)}</th>)}<th className="py-2 pl-3 font-medium text-right">Total</th></tr></thead>
                          <tbody className="divide-y divide-neutral-800">
                            {rowsC.map(r => (
                              <tr key={r.c}><td className="py-2 pr-4 text-neutral-300 whitespace-nowrap sticky left-0 bg-[#141414]">{r.c}</td>{r.vals.map((v, i) => <td key={i} className={'py-2 px-2 text-right whitespace-nowrap ' + (v ? 'text-neutral-200' : 'text-neutral-600')}>{v ? fmt(v) : '—'}</td>)}<td className="py-2 pl-3 text-right text-white font-semibold whitespace-nowrap">{fmt(r.vals.reduce((a, v) => a + v, 0))}</td></tr>
                            ))}
                            <tr className="font-bold"><td className="py-2.5 pr-4 text-white sticky left-0 bg-[#141414]">Total</td>{totals.map((v, i) => <td key={i} className="py-2.5 px-2 text-right text-white whitespace-nowrap">{fmt(v)}</td>)}<td className="py-2.5 pl-3 text-right text-[#d4af37] whitespace-nowrap">{fmt(grand)}</td></tr>
                            <tr><td className="py-2 pr-4 text-neutral-500 sticky left-0 bg-[#141414]">Variación vs. mes anterior</td>{totals.map((v, i) => <td key={i} className={'py-2 px-2 text-right font-semibold whitespace-nowrap ' + (i === 0 ? 'text-neutral-600' : v > totals[i - 1] ? 'text-red-400' : v < totals[i - 1] ? 'text-emerald-400' : 'text-neutral-400')}>{i === 0 ? '—' : varPct(v, totals[i - 1])}</td>)}<td /></tr>
                          </tbody>
                        </table>
                      </div>
                      <p className="text-[10px] text-neutral-600">Rojo: el gasto subió respecto al mes anterior. Verde: bajó. Usá «Imprimir reporte» para sacar este resumen.</p>
                    </div>
                  );
                })()}

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className={isG ? 'lg:col-span-5 space-y-6 no-print' : 'hidden'}>
                    

                    <form onSubmit={addExpense} className={CARD + ' space-y-4'}>
                      <h2 className="text-white">Registrar gasto</h2>
                      <div><label className={LBL}>Concepto</label><input value={expForm.concept} onChange={e => setExpForm({ ...expForm, concept: e.target.value })} className={INP} /></div>
                      <div className="grid grid-cols-2 gap-3">
                        <div><label className={LBL}>Categoría</label><select value={expForm.category} onChange={e => setExpForm({ ...expForm, category: e.target.value })} className={INP}>{EXPENSE_CATS.map(c => <option key={c}>{c}</option>)}</select></div>
                        <div><label className={LBL}>Monto (Gs.)</label><input type="number" inputMode="numeric" value={expForm.amount} onChange={e => setExpForm({ ...expForm, amount: e.target.value })} className={INP} /></div>
                      </div>
                      <div><label className={LBL}>Fecha</label><input type="date" value={expForm.date} onChange={e => setExpForm({ ...expForm, date: e.target.value })} className={INP} /></div>
                      <button type="submit" className="w-full py-3 rounded-xl bg-[#d4af37] hover:bg-[#e3c25b] text-black font-semibold text-sm">Registrar gasto</button>
                    </form>
                  </div>

                  <div className={isG ? 'lg:col-span-7 space-y-4' : 'lg:col-span-12 space-y-4'}>
                    <div className="flex items-center justify-between gap-3">
                      <h2 className="text-white">{isG ? 'Gastos registrados' : 'Movimientos'}</h2>
                      <div className={`inline-flex p-0.5 rounded-lg bg-[#141414] border border-[#2b2822] no-print ${isG ? 'hidden' : ''}`}>
                        {[['todos', 'Todos'], ['ingresos', 'Ingresos'], ['egresos', 'Egresos']].map(([k, l]) => (
                          <button key={k} onClick={() => setFinType(k)} className={`px-3 py-1 rounded-md text-[11px] font-medium ${finType === k ? 'bg-[#d4af37] text-black' : 'text-neutral-400 hover:text-white'}`}>{l}</button>
                        ))}
                      </div>
                    </div>
                    {groups.length === 0 && <div className={CARD + ' text-center text-sm text-neutral-500'}>Sin movimientos para mostrar.</div>}
                    {groups.map(g => {
                      const dIn = g.items.filter(m => m.type === 'in').reduce((a, m) => a + m.amount, 0);
                      const dOut = g.items.filter(m => m.type === 'out').reduce((a, m) => a + m.amount, 0);
                      return (
                        <section key={g.date} className="bg-[#141414] border border-[#2b2822] rounded-xl overflow-hidden">
                          <div className="flex items-center justify-between gap-3 px-4 py-2.5 border-b border-[#2b2822] bg-white/5">
                            <h3 className="text-sm text-neutral-200 capitalize">{dayLabel(g.date)}</h3>
                            <p className="text-[11px] text-neutral-400">Ingresos <span className="text-emerald-400">{fmt(dIn)}</span> · Egresos <span className="text-red-400">{fmt(dOut)}</span></p>
                          </div>
                          <div className="divide-y divide-neutral-800">
                            {g.items.map(m => (
                              <div key={m.id} className="px-4 py-3 flex items-center justify-between gap-3">
                                <div className="min-w-0">
                                  <p className="text-sm text-white truncate"><span className={`mr-2 px-1.5 py-0.5 rounded text-[10px] font-semibold ${m.type === 'in' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-red-500/15 text-red-400'}`}>{m.tag}</span>{m.title}</p>
                                  <p className="text-xs text-neutral-500 truncate mt-0.5">{m.sub}</p>
                                </div>
                                <div className="flex items-center gap-3 shrink-0">
                                  <span className={`text-sm font-semibold ${m.type === 'in' ? 'text-emerald-400' : 'text-red-400'}`}>{m.type === 'in' ? '+' : '-'} {fmt(m.amount)}</span>
                                  {m.exp && <button onClick={() => { if (confirm('¿Eliminar este gasto?')) setExpenses(expenses.filter(x => x.id !== m.id)); }} className="text-neutral-600 hover:text-red-500 no-print" aria-label="Eliminar"><Trash2 className="w-4 h-4" /></button>}
                                  {m.sale && <button onClick={() => { if (confirm('¿Eliminar este registro?')) setSales(sales.filter(x => x.id !== m.id)); }} className="text-neutral-600 hover:text-red-500 no-print" aria-label="Eliminar"><Trash2 className="w-4 h-4" /></button>}
                                </div>
                              </div>
                            ))}
                          </div>
                        </section>
                      );
                    })}
                    {byCat.length > 0 && (
                      <div className={CARD + ' space-y-2'}>
                        <h3 className="text-white mb-2">Gastos por categoría</h3>
                        {byCat.map(([c, v]) => <div key={c} className="flex justify-between text-xs text-neutral-400"><span>{c}</span><span className="text-neutral-200">{fmt(v)}</span></div>)}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ===== DASHBOARD GENERAL ===== */}
        {activeTab === 'dashboard' && (() => {
          const sumBy = (arr, f) => arr.reduce((acc, x) => acc + f(x), 0);
          const dayStats = (date) => {
            const done = bookings.filter(b => b.date === date && b.status === 'Completado');
            const pays = payments.filter(x => !x.voided && x.date === date);
            const sls = sales.filter(x => x.date === date);
            const incomeServ = sumBy(pays, x => x.amount);
            return {
              clients: new Set(done.map(b => b.clientId || b.clientName)).size,
              services: sumBy(done, b => (b.serviceIds || []).length || 1),
              income: incomeServ + sumBy(sls, x => x.total),
              avg: pays.length ? Math.round(incomeServ / pays.length) : 0,
            };
          };
          const today = dayStats(TODAY_STR);
          const yest = dayStats(addDays(TODAY_STR, -1));
          const delta = (a, b) => b ? Math.round((a - b) / b * 100) : null;
          const badge = (d) => d === null ? null : (
            <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded-full ${d >= 0 ? 'bg-emerald-500/15 text-emerald-400' : 'bg-red-500/15 text-red-400'}`}>{d >= 0 ? '+' : ''}{d}% vs ayer</span>
          );
          const kpis = [
            ['Clientes atendidos', today.clients, delta(today.clients, yest.clients)],
            ['Servicios realizados', today.services, delta(today.services, yest.services)],
            ['Ingresos del día', fmt(today.income), delta(today.income, yest.income)],
            ['Ticket promedio', fmt(today.avg), delta(today.avg, yest.avg)],
          ];

          // ingresos de los últimos 7 días
          const days = Array.from({ length: 7 }, (_, i) => addDays(TODAY_STR, i - 6));
          const vals = days.map(d => sumBy(payments.filter(x => !x.voided && x.date === d), x => x.amount) + sumBy(sales.filter(x => x.date === d), x => x.total));
          const niceMax = Math.max(10000, Math.ceil(Math.max(...vals) / 10000) * 10000);
          const W = 420, H = 180, pl = 46, pr = 12, pt = 14, pb = 26;
          const X = (i) => pl + i * ((W - pl - pr) / 6);
          const Y = (v) => pt + (H - pt - pb) * (1 - v / niceMax);
          const pts = vals.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
          const area = `M ${X(0)},${Y(0)} ` + vals.map((v, i) => `L ${X(i)},${Y(v)}`).join(' ') + ` L ${X(6)},${Y(0)} Z`;
          const kfmt = (v) => v >= 1000000 ? (v / 1000000).toFixed(1).replace('.0', '') + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(v);

          // servicios más solicitados (últimos 30 días)
          const counts = {};
          bookings.filter(b => b.status !== 'Cancelado' && inRange(b.date, 'mes')).forEach(b => (b.serviceIds || []).forEach(id => {
            const sv = services.find(x => x.id === id);
            if (sv) counts[sv.name] = (counts[sv.name] || 0) + 1;
          }));
          const ranked = Object.entries(counts).sort((x, y) => y[1] - x[1]);
          const top = ranked.slice(0, 8);
          const rest = ranked.slice(8).reduce((acc, x) => acc + x[1], 0);
          if (rest) top.push(['Otros', rest]);
          const totalSrv = top.reduce((acc, x) => acc + x[1], 0);
          const colorOf = (name, i) => name === 'Otros' ? SPAL[10] : SPAL[i % 10];
          const C = 2 * Math.PI * 40;
          let off = 0;

          const nowD = new Date(nowTick);
          const nowM = nowD.getHours() * 60 + nowD.getMinutes();
          const todayB = bookings.filter(b => b.date === TODAY_STR && b.status !== 'Cancelado').sort((x, y) => x.time.localeCompare(y.time)).slice(0, 6);
          const nextHalf = () => { const d = new Date(); return toHHMM(Math.min(Math.ceil((d.getHours() * 60 + d.getMinutes()) / 30) * 30, 23 * 60 + 30)); };

          return (
            <div className="space-y-5">
              <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
                <div>
                  <h2 className="text-white">Dashboard general</h2>
                  <p className="text-xs text-neutral-500 mt-0.5">Resumen del negocio en tiempo real · {new Date(TODAY_STR + 'T12:00:00').toLocaleDateString('es-PY', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => openBooking(TODAY_STR, nextHalf(), barbers[0] && barbers[0].id)} className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#d4af37] hover:bg-[#e3c25b] text-black text-xs font-semibold"><PlusCircle className="w-4 h-4" />Nueva reserva</button>
                  <button onClick={() => setActiveTab('mercaderia')} className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-[#2b2822] text-xs font-semibold text-neutral-300 hover:text-white hover:border-[#d4af37]"><Package className="w-4 h-4" />Registrar venta</button>
                  <button onClick={() => setActiveTab('gastos')} className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-[#2b2822] text-xs font-semibold text-neutral-300 hover:text-white hover:border-[#d4af37]"><Wallet className="w-4 h-4" />Registrar gasto</button>
                  <button onClick={() => setCierreOpen(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-[#2b2822] text-xs font-semibold text-neutral-300 hover:text-white hover:border-[#d4af37]"><Receipt className="w-4 h-4" />Cierre del día</button>
                </div>
              </div>

              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                {kpis.map(([label, value, d]) => (
                  <div key={label} className="bg-[#141414] border border-[#2b2822] rounded-xl p-3.5 sm:p-4">
                    <p className="text-[11px] text-neutral-500">{label}</p>
                    <p className="text-lg sm:text-2xl font-bold text-white mt-1 break-words leading-tight">{value}</p>
                    <div className="mt-1.5 min-h-[20px]">{badge(d)}</div>
                  </div>
                ))}
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                <div className={CARD + ' lg:col-span-7'}>
                  <h3 className="text-white">Evolución de ingresos <span className="text-xs text-neutral-500 font-normal">(últimos 7 días)</span></h3>
                  <svg viewBox={`0 0 ${W} ${H}`} className="w-full mt-3" role="img" aria-label="Ingresos de los últimos 7 días">
                    {[0, 0.25, 0.5, 0.75, 1].map(f => (
                      <g key={f}>
                        <line x1={pl} x2={W - pr} y1={Y(niceMax * f)} y2={Y(niceMax * f)} stroke="#e2dfd6" strokeWidth="1" />
                        <text x={pl - 6} y={Y(niceMax * f) + 3} textAnchor="end" fontSize="9" fill="#6e6e6e">{kfmt(niceMax * f)}</text>
                      </g>
                    ))}
                    <path d={area} fill="rgba(212,175,55,0.2)" />
                    <polyline points={pts} fill="none" stroke="#d4af37" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
                    {vals.map((v, i) => (
                      <g key={days[i]}>
                        <circle cx={X(i)} cy={Y(v)} r="3.5" fill="#d4af37" stroke="#fff" strokeWidth="1.5"><title>{fmt(v)}</title></circle>
                        <text x={X(i)} y={H - 8} textAnchor="middle" fontSize="9" fill="#6e6e6e">{new Date(days[i] + 'T12:00:00').toLocaleDateString('es-PY', { weekday: 'short' }).replace('.', '')}</text>
                      </g>
                    ))}
                  </svg>
                </div>

                <div className={CARD + ' lg:col-span-5 flex flex-col'}>
                  <h3 className="text-white">Servicios más solicitados <span className="text-xs text-neutral-500 font-normal">(30 días)</span></h3>
                  {totalSrv === 0 ? <p className="text-xs text-neutral-500 py-10 text-center">Todavía no hay servicios registrados.</p> : (
                    <div className="flex-1 flex items-center justify-center gap-5 mt-3">
                      <svg viewBox="0 0 120 120" className="w-36 h-36 sm:w-48 sm:h-48 shrink-0">
                        <circle cx="60" cy="60" r="49" fill="#ece9e0" />
                        {(() => { let ang = -Math.PI / 2; return top.map(([name, n], i) => { const a1 = ang + n / totalSrv * Math.PI * 2; const el = <path key={name} d={arcPath(60, 60, 31, 50, ang, a1)} fill={colorOf(name, i)} stroke="#c9c4b8" strokeWidth="0.5"><title>{name}: {n}</title></path>; ang = a1; return el; }); })()}
                        <text x="60" y="58" textAnchor="middle" fontSize="18" fontWeight="700" fill="#151515">{totalSrv}</text>
                        <text x="60" y="72" textAnchor="middle" fontSize="8" fill="#6e6e6e">servicios</text>
                      </svg>
                      <div className="flex-1 min-w-0 space-y-2.5">
                        {top.map(([name, n], i) => (
                          <div key={name} className="flex items-center justify-between gap-2 text-sm">
                            <span className="flex items-center gap-2 min-w-0 text-neutral-300"><span className="w-2.5 h-2.5 rounded-sm shrink-0" style={{ background: colorOf(name, i), border: '1px solid rgba(0,0,0,.2)' }}></span><span className="truncate">{name}</span></span>
                            <span className="text-white font-semibold shrink-0">{Math.round(n / totalSrv * 100)}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="space-y-3">
                <div className="flex items-center justify-between gap-3">
                  <h3 className="text-white">Equipo de barberos</h3>
                  <span className="text-[11px] text-neutral-500">Se actualiza solo · {toHHMM(nowM)} hs</span>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                  {barbers.map(br => {
                    const todays = bookings.filter(b => b.barberId === br.id && b.date === TODAY_STR && b.status !== 'Cancelado' && b.status !== 'Ausente').sort((x, y) => x.time.localeCompare(y.time));
                    const cur = todays.find(b => b.status === 'Pendiente' && toMin(b.time) <= nowM && nowM < toMin(b.time) + (Number(b.duration) || 0));
                    const next = todays.find(b => b.status === 'Pendiente' && toMin(b.time) > nowM);
                    const scd = schedule[nowD.getDay()];
                    const closed = !scd || !scd.on || nowM < toMin(scd.open) || nowM >= toMin(scd.close);
                    const state = closed ? 'closed' : cur ? 'busy' : 'free';
                    const pct = cur ? Math.min(100, Math.round((nowM - toMin(cur.time)) / Math.max(1, Number(cur.duration)) * 100)) : 0;
                    return (
                      <div key={br.id} className={`rounded-xl border p-4 ${state === 'busy' ? 'border-red-500/40 bg-red-500/5' : state === 'free' ? 'border-emerald-500/40 bg-emerald-500/5' : 'border-[#2b2822] bg-[#141414]'}`}>
                        <div className="flex items-center justify-between gap-3">
                          <p className="text-sm font-semibold text-white truncate">{br.name}</p>
                          <span className={`flex items-center gap-2 text-xs font-semibold shrink-0 ${state === 'busy' ? 'text-red-400' : state === 'free' ? 'text-emerald-400' : 'text-neutral-500'}`}>
                            <span className={`w-2.5 h-2.5 rounded-full ${state === 'busy' ? 'bg-red-500 dot-busy' : state === 'free' ? 'bg-emerald-500 dot-free' : 'bg-neutral-400'}`}></span>
                            {state === 'busy' ? 'Ocupado' : state === 'free' ? 'Libre' : 'Fuera de horario'}
                          </span>
                        </div>
                        {state === 'busy' && (
                          <div className="mt-3 space-y-1.5">
                            <p className="text-xs text-neutral-300 truncate">Atendiendo a <span className="font-semibold text-white">{cur.clientName}</span> · {cur.serviceNames}</p>
                            <div className="h-1.5 rounded-full bg-[#ece9e0] overflow-hidden"><div className="h-full rounded-full bg-red-500 busy-bar" style={{ width: pct + '%' }}></div></div>
                            <p className="text-[11px] text-neutral-500">Termina a las {toHHMM(toMin(cur.time) + (Number(cur.duration) || 0))} hs{next ? ` · siguiente ${next.time} hs` : ''}</p>
                          </div>
                        )}
                        {state === 'free' && (
                          <div className="mt-3 space-y-2">
                            <p className="text-xs text-neutral-400">{next ? `Próximo turno a las ${next.time} hs (${next.clientName})` : 'Sin más turnos hoy'}</p>
                            <button type="button" onClick={() => openBooking(TODAY_STR, nextHalf(), br.id)} className="w-full py-1.5 rounded-lg border border-dashed border-emerald-500/50 text-[11px] font-semibold text-emerald-400 hover:bg-emerald-500/10">+ Agendar ahora</button>
                          </div>
                        )}
                        {state === 'closed' && <p className="mt-3 text-xs text-neutral-500">Fuera del horario de atención.</p>}
                        <p className="mt-2 text-[11px] text-neutral-500">Turnos de hoy: {todays.length}</p>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className={CARD}>
                <h3 className="text-white mb-3">Turnos de hoy</h3>
                <div className="divide-y divide-neutral-800">
                  {todayB.map(b => (
                    <div key={b.id} className="py-2.5 flex items-center justify-between gap-3 text-xs">
                      <span className="text-neutral-300 truncate"><span className="font-semibold text-white">{b.time}</span> · {b.clientName} · {b.serviceNames}</span>
                      <span className={`shrink-0 px-2 py-0.5 rounded-full text-[10px] font-semibold ${b.status === 'Completado' ? 'bg-emerald-500/15 text-emerald-400' : b.status === 'Pendiente' ? 'bg-red-500/15 text-red-400' : 'bg-neutral-800 text-neutral-400'}`}>{b.status === 'Completado' ? 'Cobrado' : b.status === 'Pendiente' ? 'Por cobrar' : b.status}</span>
                    </div>
                  ))}
                  {todayB.length === 0 && <p className="text-xs text-neutral-500 py-4 text-center">No hay turnos para hoy.</p>}
                </div>
              </div>
            </div>
          );
        })()}

        {/* ===== BARBEROS / EQUIPO ===== */}
        {activeTab === 'equipo' && (() => {
          const cards = barbers.map(b => ({ b, st: barberStats(b.id, statsPeriod, statsDay) }));
          const totalAll = cards.reduce((acc, c) => acc + c.st.total, 0);
          const servAll = cards.reduce((acc, c) => acc + c.st.services, 0);
          const shareAll = cards.reduce((acc, c) => acc + c.st.share, 0);
          return (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                  <h2 className="text-white">Barberos y equipo</h2>
                  <p className="text-xs text-neutral-500 mt-0.5">Tocá la tarjeta de un barbero para ver su informe completo.</p>
                </div>
                <div className="inline-flex max-w-full overflow-x-auto no-scrollbar self-start sm:self-auto p-0.5 rounded-lg bg-[#141414] border border-[#2b2822]">
                  {[['hoy', 'Hoy'], ['semana', 'Semana'], ['quincena', 'Quincena'], ['mes', 'Mes'], ['ano', 'Año']].map(([k, l]) => (
                    <button key={k} onClick={() => { setStatsPeriod(k); setStatsDay(''); }} className={`px-2.5 py-1 rounded-md text-[11px] font-medium whitespace-nowrap ${!statsDay && statsPeriod === k ? 'bg-[#d4af37] text-black' : 'text-neutral-400 hover:text-white'}`}>{l}</button>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2 text-xs text-neutral-400">
                <span>Ver un solo día:</span>
