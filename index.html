                <h3 className="text-white">Balance del período</h3>
                <div className="text-xs space-y-1.5">
                  {METHODS.map(m => <div key={m} className="flex justify-between text-neutral-400"><span>{m}</span><span className="text-neutral-200">{fmt(byMethod[m])}</span></div>)}
                </div>
                <div className="pt-3 border-t border-[#2b2822] space-y-2">
                  <div className="flex items-center justify-between text-xs text-neutral-400">
                    <span>Comisión del barbero (%)</span>
                    {role === 'tecnico'
                      ? <input type="number" min="0" max="100" value={commissions[b.id] ?? 50} onChange={e => setCommissions({ ...commissions, [b.id]: e.target.value })} className="w-16 bg-black border border-[#2b2822] rounded-lg px-2 py-1 text-right text-white outline-none focus:border-[#d4af37]" />
                      : <span className="text-white">{st.pc}%</span>}
                  </div>
                  <div className="flex justify-between text-sm"><span className="text-neutral-400">Total cobrado</span><span className="font-semibold text-white">{fmt(st.total)}</span></div>
                  <div className="flex justify-between text-sm"><span className="text-neutral-400">Parte del barbero</span><span className="font-semibold text-white">{fmt(st.share)}</span></div>
                  <div className="flex justify-between text-sm"><span className="text-neutral-400">Consumos (mercadería)</span><span className="font-semibold text-red-400">- {fmt(st.cons)}</span></div>
                  <div className="flex justify-between text-sm"><span className="text-neutral-200 font-semibold">Neto del barbero</span><span className="font-bold text-emerald-400">{fmt(st.net)}</span></div>
                  <div className="flex justify-between text-sm"><span className="text-neutral-400">Parte de la barbería</span><span className="font-semibold text-white">{fmt(st.total - st.share)}</span></div>
                </div>
              </div>

              {barberDetail(b.id, statsPeriod, false, statsDay)}

              <div className="flex flex-wrap gap-2 pt-1">
                <button type="button" onClick={() => openReport([b.id], statsPeriod, statsDay)} className="flex-1 min-w-[160px] py-3 rounded-xl bg-[#d4af37] hover:bg-[#e3c25b] text-black text-sm font-semibold">Descargar reporte de {b.name}</button>
                {barbers.length > 1 && <button type="button" onClick={() => { if (confirm(`¿Eliminar a ${b.name}?`)) { setBarbers(barbers.filter(x => x.id !== b.id)); setOpenBarber(''); } }} className="flex items-center justify-center gap-2 px-4 py-3 rounded-xl border border-red-600/60 text-red-400 hover:bg-red-600/10 text-sm"><Trash2 className="w-4 h-4" />Eliminar barbero</button>}
                <button type="button" onClick={() => setOpenBarber('')} className="px-4 py-3 rounded-xl border border-[#2b2822] text-sm text-neutral-300 hover:text-white">Cerrar</button>
              </div>
            </div>
          </div>
        );
      })()}

      {receiptView && (
        <div className="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4" onClick={() => setReceiptView(null)}>
          <img src={receiptView} alt="Comprobante" className="max-h-full max-w-full rounded-xl" />
        </div>
      )}

      {waModalOpen && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#141414] border border-[#2b2822] w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-xl p-4 sm:p-6 space-y-5 animate-in fade-in zoom-in duration-150">
            
            <div className="flex items-center justify-between pb-3 border-b border-[#2b2822]">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-lg bg-white/10 text-neutral-200 flex items-center justify-center">
                  <MessageSquare className="w-5 h-5" />
                </div>
                <h3 className="text-base font-bold text-white">Preparar WhatsApp Manual</h3>
              </div>
              <button
                onClick={() => setWaModalOpen(false)}
                className="text-neutral-400 hover:text-white"
              >
                <XCircle className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-3">
              <label className="text-xs text-neutral-400 font-semibold uppercase">
                Destinatario: <span className="text-white font-bold">{waData.clientName} ({waData.phone})</span>
              </label>

              <textarea
                rows={8}
                value={waData.message}
                onChange={e => setWaData({ ...waData, message: e.target.value })}
                className="w-full bg-black border border-[#2b2822] rounded-xl p-3.5 text-xs text-neutral-200 outline-none focus:border-[#d4af37] leading-relaxed"
              />
            </div>

            {/* ACTION BUTTONS */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              <button
                onClick={handleCopyMessage}
                className={`py-3 px-4 rounded-xl font-bold text-xs transition-all flex items-center justify-center space-x-2 border ${
                  copiedMessage
                    ? 'bg-white/10 text-neutral-200 border-white/30'
                    : 'bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border-neutral-700'
                }`}
              >
                {copiedMessage ? <Check className="w-4 h-4 text-neutral-200" /> : <Copy className="w-4 h-4" />}
                <span>{copiedMessage ? '¡Mensaje Copiado!' : '1. Copiar Mensaje'}</span>
              </button>

              <button
                onClick={handleOpenWhatsAppLink}
                className="py-3 px-4 rounded-xl bg-[#d4af37] hover:bg-[#e3c25b] text-black font-bold text-xs transition-all flex items-center justify-center space-x-2 "
              >
                <ExternalLink className="w-4 h-4" />
                <span>2. Abrir WhatsApp</span>
              </button>
            </div>

            <p className="text-[11px] text-center text-neutral-500">
              Blackmen Control no envía mensajes automatizados. Toda interacción es controlada manualmente por el personal de recepción.
            </p>

          </div>
        </div>
      )}

      {/* ========================================================
          MODAL: REGISTRO / EDICIÓN DE CLIENTE DESDE CRM
         ======================================================== */}
      {clientFormModalOpen && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#141414] border border-[#2b2822] w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-xl p-4 sm:p-6 space-y-4">
            
            <div className="flex items-center justify-between pb-3 border-b border-[#2b2822]">
              <h3 className="text-base font-bold text-white">
                {isEditingClient ? 'Editar Ficha del Cliente' : 'Registrar Nuevo Cliente'}
              </h3>
              <button onClick={() => setClientFormModalOpen(false)} className="text-neutral-400 hover:text-white">
                <XCircle className="w-5 h-5" />
              </button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                const ph = (selectedClient.phone || '').replace(/\D/g, '');
                if (ph && clients.some(c => c.id !== selectedClient.id && (c.phone || '').replace(/\D/g, '') === ph)) return alert('Ya existe un cliente con ese teléfono.');
                if (isEditingClient) {
                  setClients(clients.map(c => c.id === selectedClient.id ? selectedClient : c));
                } else {
                  setClients([selectedClient, ...clients]);
                }
                setClientFormModalOpen(false);
              }}
              className="space-y-4 text-xs"
            >
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-neutral-400">Nombre *</label>
                  <input
                    type="text"
                    required
                    value={selectedClient?.name || ''}
                    onChange={e => setSelectedClient({ ...selectedClient, name: e.target.value })}
                    className="w-full mt-1 bg-black border border-[#2b2822] rounded-lg p-2.5 text-neutral-100 outline-none focus:border-[#d4af37]"
                  />
                </div>
                <div>
                  <label className="text-neutral-400">Apellido *</label>
                  <input
                    type="text"
                    required
                    value={selectedClient?.lastname || ''}
                    onChange={e => setSelectedClient({ ...selectedClient, lastname: e.target.value })}
                    className="w-full mt-1 bg-black border border-[#2b2822] rounded-lg p-2.5 text-neutral-100 outline-none focus:border-[#d4af37]"
                  />
                </div>
              </div>

              <div>
                <label className="text-neutral-400">Teléfono (WhatsApp / ID Único) *</label>
                <input
                  type="tel"
                  required
                  value={selectedClient?.phone || ''}
                  onChange={e => setSelectedClient({ ...selectedClient, phone: e.target.value })}
                  className="w-full mt-1 bg-black border border-[#2b2822] rounded-lg p-2.5 text-neutral-100 outline-none focus:border-[#d4af37]"
                />
              </div>

              <div>
                <label className="text-neutral-400">Fecha de Nacimiento (Opcional para Cumpleaños)</label>
                <input
                  type="date"
                  value={selectedClient?.birthdate || ''}
                  onChange={e => setSelectedClient({ ...selectedClient, birthdate: e.target.value })}
                  className="w-full mt-1 bg-black border border-[#2b2822] rounded-lg p-2.5 text-neutral-100 outline-none focus:border-[#d4af37]"
                />
              </div>

              <div>
                <label className="text-neutral-400">Barbero Habitual</label>
                <select
                  value={selectedClient?.preferredBarberId || 'b1'}
                  onChange={e => setSelectedClient({ ...selectedClient, preferredBarberId: e.target.value })}
                  className="w-full mt-1 bg-black border border-[#2b2822] rounded-lg p-2.5 text-neutral-100 outline-none focus:border-[#d4af37]"
                >
                  {barbers.map(b => (
                    <option key={b.id} value={b.id}>{b.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-neutral-400">Preferencias de Servicios / Bebida</label>
                <textarea
                  rows={2}
                  value={selectedClient?.preferences || ''}
                  onChange={e => setSelectedClient({ ...selectedClient, preferences: e.target.value })}
                  className="w-full mt-1 bg-black border border-[#2b2822] rounded-lg p-2.5 text-neutral-100 outline-none focus:border-[#d4af37]"
                />
              </div>

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={() => setClientFormModalOpen(false)}
                  className="px-4 py-2 rounded-lg bg-neutral-800 text-neutral-300 font-semibold"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-lg bg-[#d4af37] text-black font-bold"
                >
                  Guardar Ficha
                </button>
              </div>
            </form>

          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
